[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astral-gp"
version = "0.2.0"
description = "Variance-driven placement of training data for Gaussian process surrogates"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Marko Ristić", email = "maristic@ucsd.edu" },
    { name = "Brandon Barker" },
    { name = "Trevor Gravely" },
]
keywords = [
    "gaussian-process",
    "active-learning",
    "surrogate-model",
    "design-of-experiments",
    "astrophysics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
examples = ["jupyter>=1.0", "notebook>=7.0"]
dev = ["pytest>=7.0"]

[project.scripts]
astral-gp = "astral_gp.cli:main"

[project.urls]
Homepage = "https://github.com/astrobarker/astral-gp"
Issues = "https://github.com/astrobarker/astral-gp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::UserWarning",
    # log(0) from the deliberately unclamped length-scale lower bound
    "ignore:divide by zero encountered in log:RuntimeWarning",
]
